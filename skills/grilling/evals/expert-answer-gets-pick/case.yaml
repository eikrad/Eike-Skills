schema_version: "1.1"
name: expert-answer-gets-pick
expected_outcome: |
  The user chooses JSON for a deployed courses table whose reporting clients and planned waitlist contract make a later change costly. The reply records the user's direction, gives its own technical recommendation with its reason and credible material downside, and asks one question about the unaddressed contention or migration risk. The need for a probe comes from those actual dependencies, not from treating every data model as irreversible.
context:
  scaffold_script: place-files.sh
