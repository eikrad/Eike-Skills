name: early-end-names-open-branches
expected_outcome: |
  The user asks an ambiguous readiness question rather than explicitly stopping the interview. A two-hour offer can outlive the course's start, which conflicts with the stated requirement. The reply identifies this concrete unresolved blocker and asks one focused question about resolving or deferring it, without a compulsory restatement or table approval and without deciding the behavior itself.
